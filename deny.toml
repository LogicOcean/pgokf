[advisories]
# RUSTSEC-2021-0127: serde_cbor is unmaintained. It remains a mandatory
# dependency of pgrx 0.19.x (pgokf -> pgrx 0.19.2 -> serde_cbor 0.11.2) and
# the advisory offers no fixed release. Re-evaluate at the next pgrx upgrade
# or by 2027-02-28, whichever comes first.
ignore = [
  { id = "RUSTSEC-2021-0127", reason = "serde_cbor is unmaintained but is a mandatory dependency of pgrx 0.19.x with no fixed release" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # Public-domain dedication carried by tiny-keccak, a transitive dependency of
  # arrow-array (arrow -> ahash -> const-random -> tiny-keccak). CC0-1.0 imposes
  # no attribution or copyleft obligations.
  "CC0-1.0",
  # Carried by webpki-root-certs (the Mozilla root-CA bundle reqwest/rustls use
  # to verify TLS to a real S3 endpoint), a transitive dependency of the
  # pgokf-ingest companion: object_store -> reqwest -> rustls-platform-verifier
  # -> webpki-root-certs. CDLA-Permissive-2.0 is a permissive data license with
  # no copyleft or attribution obligations on the consuming code.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
