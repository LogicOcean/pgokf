[advisories]
# No ignored advisories. pgrx is vendored (vendor/pgrx, see its VENDORING.md)
# with the unmaintained serde_cbor dependency removed, so the resolved graph
# carries no advisory.

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # Public-domain dedication carried by tiny-keccak, a transitive dependency of
  # arrow-array (arrow -> ahash -> const-random -> tiny-keccak). CC0-1.0 imposes
  # no attribution or copyleft obligations.
  "CC0-1.0",
  # Carried by webpki-root-certs (the Mozilla root-CA bundle reqwest/rustls use
  # to verify TLS to a real S3 endpoint), a transitive dependency of the
  # pgokf-ingest companion: object_store -> reqwest -> rustls-platform-verifier
  # -> webpki-root-certs. CDLA-Permissive-2.0 is a permissive data license with
  # no copyleft or attribution obligations on the consuming code.
  "CDLA-Permissive-2.0",
  "ISC",
  # All pgokf crates (extension, okf-parser, okf-sync, and the pgokf-* companions)
  # are AGPL-3.0-only. MIT below remains for permissively-licensed dependencies.
  "AGPL-3.0-only",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
