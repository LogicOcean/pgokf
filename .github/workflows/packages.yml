name: packages

# Build the distributable artifacts for every supported PostgreSQL major, on
# amd64 AND arm64. Each architecture builds natively on its own hosted runner
# (no QEMU emulation), is smoke-tested there, and the per-arch images are
# merged into one multi-architecture manifest per tag - so the published
# images run unchanged on x86 servers, arm64 servers, and Apple Silicon.
# Runs on tags and on demand; also on pushes touching packaging so the build
# scripts stay green. Push and pull-request events only build and smoke-test.
# Publication is workflow_dispatch-only: the explicit release_tag input must
# name the current immutable tag, and the resolver proves the selected source
# is that tag's commit before any registry write can run.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "packaging/**"
      - "deploy/**"
      - "META.json"
      - ".dockerignore"
      - ".hadolint.yaml"
      - ".github/workflows/packages.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "about.hbs"
      - "about.toml"
      - "vendored-notices.toml"
      - "THIRD-PARTY-NOTICES.txt"
      - "scripts/install-cargo-about.sh"
      - "crates/**/Cargo.toml"
      - "crates/pgokf-verifier/src/lib.rs"
      - "crates/pgokf-verifier/src/main.rs"
      - "crates/pgokf-verifier/src/notices.rs"
      - "crates/pgokf-web/src/routes.rs"
      - "crates/pgokf-web/static/*.js"
      - "crates/pgokf-web/static/vendor/**"
      - "third-party-notice-evidence/**"
  pull_request:
    paths:
      - "packaging/**"
      - "deploy/**"
      - "META.json"
      - ".dockerignore"
      - ".hadolint.yaml"
      - ".github/workflows/packages.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "about.hbs"
      - "about.toml"
      - "vendored-notices.toml"
      - "THIRD-PARTY-NOTICES.txt"
      - "scripts/install-cargo-about.sh"
      - "crates/**/Cargo.toml"
      - "crates/pgokf-verifier/src/lib.rs"
      - "crates/pgokf-verifier/src/main.rs"
      - "crates/pgokf-verifier/src/notices.rs"
      - "crates/pgokf-web/src/routes.rs"
      - "crates/pgokf-web/static/*.js"
      - "crates/pgokf-web/static/vendor/**"
      - "third-party-notice-evidence/**"
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Publish only the current v0.6.0 immutable release tag. Historical and
          retired tags are unsupported. Empty: build and smoke-test only.
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  # Keep in sync with rust-toolchain.toml and the workspace pgrx dependency.
  RUST_TOOLCHAIN: "1.96.0"
  CARGO_PGRX_VERSION: "0.19.2"
  SERVER_IMAGE: ghcr.io/logicocean/pgokf
  COMPANIONS_IMAGE: ghcr.io/logicocean/pgokf-companions
  # Pinned Dockerfile linter (binary + checksum) for the lint job.
  HADOLINT_VERSION: "2.15.1"
  HADOLINT_SHA256: "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"

# Bind the system Bash independently of PATH after removing startup hooks.
defaults:
  run:
    shell: /usr/bin/env -u BASH_ENV -u ENV /bin/bash --noprofile --norc -e -o pipefail {0}

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the one version every artifact carries, whether this run publishes
  # images, and the exact immutable source every job builds. The control file
  # is the single source of truth (the same one build-deb.sh reads).
  # Publication is dispatch-only: packaging/resolve-release.sh accepts an
  # explicit workflow_dispatch tag only when it is v<default_version> AND the
  # checked-out HEAD is that tag's commit. Pushes, including tag pushes, build
  # and smoke-test but cannot publish images/manifests.
  # ---------------------------------------------------------------------------
  prep:
    name: Resolve version and publish intent
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
    steps:
      # An explicit dispatch checks out the current immutable tag; every other
      # event checks out its own ref. fetch-depth: 0 so the tag object is
      # present and the resolver can prove HEAD is the tag's commit.
      # Keep validation tooling separate from the proven release source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: release-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          path: release-source
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.96.0"
      - name: Resolve version, publish intent, and source ref
        id: resolve
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        working-directory: release-source
        run: ../release-tools/packaging/resolve-release.sh

  notices:
    name: Verify release notices
    needs: prep
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout selected release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prep.outputs.source_ref }}
          path: release-source
      - name: Checkout current provenance tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: release-tools
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install checksum-pinned cargo-about
        run: release-tools/scripts/install-cargo-about.sh "$RUNNER_TEMP/cargo-about"
      # cargo-about resolves the complete release-source workspace under
      # --frozen while this job only builds release-tools' pgokf-verifier; the
      # remaining release lockfile entries must be prefetched with the
      # identical --locked resolution.
      - name: Prefetch locked release-source dependencies
        working-directory: release-source
        run: cargo fetch --locked
      - name: Verify deterministic third-party notices
        run: cargo run --locked --manifest-path release-tools/Cargo.toml -p pgokf-verifier -- notices-verify release-source "$RUNNER_TEMP/cargo-about"

  # ---------------------------------------------------------------------------
  # Static checks on the container packaging: Dockerfiles, the shell scripts
  # they run, and the shipped compose stack.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint container packaging
    needs: prep
    runs-on: ubuntu-24.04
    steps:
      # Full history and tags: the historical-source guard executes the
      # pinned immutable release tags (the Rust workflow verifier enforces this).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prep.outputs.source_ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.96.0"
      - name: Install Ruby formula observation runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby
      - name: Portable source-packaging and cleanup guards
        run: |
          cargo test --locked -p pgokf-verifier
          cargo run --locked -p pgokf-verifier -- history-check .
          cargo run --locked -p pgokf-verifier -- release-check .
          cargo run --locked -p pgokf-verifier -- workflow-check .
      - name: Reject repository-owned non-Rust verification
        run: cargo run --locked -p pgokf-verifier -- source-guard .

      - name: hadolint (pinned binary, checksum-verified)
        run: |
          curl -fsSL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  /usr/local/bin/hadolint" | sha256sum -c -
          chmod +x /usr/local/bin/hadolint
          hadolint packaging/docker/Dockerfile packaging/docker/Dockerfile.companions

      - name: shellcheck
        run: |
          shellcheck -s bash \
            packaging/docker/*.sh \
            packaging/docker/initdb/*.sh \
            packaging/docker/bin/* \
            packaging/deb/build-deb.sh

      - name: Dockerfile semantics check for every major
        run: |
          for pg in 15 16 17 18; do
            docker build --check -f packaging/docker/Dockerfile --build-arg PG_MAJOR="$pg" .
          done
          docker build --check -f packaging/docker/Dockerfile.companions .

      - name: Compose stack renders with the example environment
        run: cargo run --locked -p pgokf-verifier -- compose-check .

  # ---------------------------------------------------------------------------
  # META.json is PG-independent; validate it once.
  # ---------------------------------------------------------------------------
  meta:
    name: Validate META.json (PGXN)
    needs: prep
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prep.outputs.source_ref }}

      - name: Checkout release validation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: release-tools

      # The main SQL named by provides.*.file is committed at the release
      # bump (generated by `cargo pgrx schema`; pgrx's entity ordering is
      # unstable across invocations, so equality is the normalized statement
      # multiset, not bytes). Regenerate it here and prove the committed
      # snapshot is content-identical, so the manifest's promised file is
      # proven canonical at dist time.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Validate PGXN metadata in Rust
        run: cargo run --locked --manifest-path release-tools/Cargo.toml -p pgokf-verifier -- pgxn-check META.json

      - name: Install PostgreSQL 18 dev files (PGDG)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --batch --yes --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-server-dev-18 libclang-dev

      - name: Install cargo-pgrx and initialize PostgreSQL 18
        run: |
          cargo install --locked cargo-pgrx --version "${CARGO_PGRX_VERSION}"
          cargo pgrx init --pg18=/usr/lib/postgresql/18/bin/pg_config

      - name: Regenerate the install SQL and compare with the committed snapshot
        run: |
          target=$(jq -r '.provides.pgokf.file' META.json)
          ( cd crates/extension && cargo pgrx schema pg18 --no-default-features --features pg18 ) > /tmp/pgokf-regenerated.sql
          ( cd crates/extension && cargo pgrx schema pg18 --no-default-features --features pg18 ) > /tmp/pgokf-regenerated-again.sql
          cargo run --locked --manifest-path release-tools/Cargo.toml -p pgokf-verifier -- compare-install-sql /tmp/pgokf-regenerated.sql /tmp/pgokf-regenerated-again.sql
          cargo run --locked --manifest-path release-tools/Cargo.toml -p pgokf-verifier -- compare-install-sql "$target" /tmp/pgokf-regenerated.sql

  # ---------------------------------------------------------------------------
  # The maintained suite for packaging/deb/build-deb.sh is the gate the
  # production deb build depends on: build-deb.sh may not run anywhere in
  # this workflow unless its own tests passed first, against the same
  # proven source the deb job builds. Read-only like every validation job
  # (no packages: write, no persisted credentials); the suite runs entirely
  # inside a disposable stub fixture and writes nothing outside it.
  # ---------------------------------------------------------------------------
  deb-suite:
    name: Maintained deb packaging suite
    needs: prep
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout selected release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prep.outputs.source_ref }}

      - name: Run the maintained build-deb.sh suite
        run: packaging/deb/test-build-deb.sh

  deb:
    name: Build .deb (PostgreSQL ${{ matrix.pg }}, ${{ matrix.arch }})
    needs: [prep, notices, deb-suite]
    runs-on: ${{ matrix.runner }}
    # Every declared major is required; missing provisioning must fail.
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 16, 17, 18]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prep.outputs.source_ref }}

      - name: Checkout release validation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: release-tools

      # Pinned via the action ref (1.96.0), consistent with ci.yml and
      # pgrx-test.yml; RUST_TOOLCHAIN below documents the same version for the
      # Docker build args.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install PostgreSQL ${{ matrix.pg }} server + dev files (PGDG)
        id: pgdg
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --batch --yes --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          if ! apt-cache show "postgresql-${{ matrix.pg }}" > /dev/null 2>&1; then
            echo "::error::postgresql-${{ matrix.pg }} is required but missing from PGDG."
            exit 1
          fi
          if ! sudo apt-get install -y \
            postgresql-${{ matrix.pg }} \
            postgresql-server-dev-${{ matrix.pg }} \
            libclang-dev; then
            echo "::error::failed to install postgresql-${{ matrix.pg }} (required leg)."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Install cargo-pgrx and initialize PostgreSQL ${{ matrix.pg }}
        if: steps.pgdg.outputs.available == 'true'
        run: |
          cargo install --locked cargo-pgrx --version "${CARGO_PGRX_VERSION}"
          cargo pgrx init --pg${{ matrix.pg }}=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

      # Uses the single build primitive internally (cargo pgrx package for this
      # major, package-scoped to the extension crate) then dpkg-deb --build.
      - name: Build .deb
        if: steps.pgdg.outputs.available == 'true'
        run: packaging/deb/build-deb.sh ${{ matrix.pg }}

      - name: Inspect .deb (metadata + payload)
        if: steps.pgdg.outputs.available == 'true'
        run: |
          deb=$(ls target/packaging/deb/postgresql-${{ matrix.pg }}-pgokf_*_${{ matrix.arch }}.deb)
          echo "== dpkg-deb -I =="; dpkg-deb -I "$deb"
          echo "== dpkg-deb -c =="; dpkg-deb -c "$deb"

      - name: Smoke test .deb (CREATE EXTENSION on a scratch cluster)
        if: steps.pgdg.outputs.available == 'true'
        run: |
          # apt only treats a local .deb argument as a file when the path is
          # absolute or ./-prefixed; a bare relative path (target/...) is parsed
          # as a package name and fails with "Unable to locate package". Resolve
          # to an absolute path so `apt-get install` installs the built file.
          deb=$(ls "$PWD"/target/packaging/deb/postgresql-${{ matrix.pg }}-pgokf_*_${{ matrix.arch }}.deb)
          sudo apt-get install -y "$deb"
          cargo run --locked --manifest-path release-tools/Cargo.toml -p pgokf-verifier -- deb-smoke /usr/lib/postgresql/${{ matrix.pg }}/bin "${{ needs.prep.outputs.version }}" "$RUNNER_TEMP/deb-smoke-evidence"

      - name: Structurally check the RPM spec
        if: steps.pgdg.outputs.available == 'true' && matrix.pg == 18 && matrix.arch == 'amd64'
        run: |
          cargo run --locked --manifest-path release-tools/Cargo.toml -p pgokf-verifier -- rpm-check packaging/rpm/pgokf.spec

      - name: Upload .deb artifact
        if: steps.pgdg.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgokf-deb-pg${{ matrix.pg }}-${{ matrix.arch }}
          path: target/packaging/deb/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Per-major, per-architecture server image. Built and smoke-tested natively
  # on each read-only runner. Separate dispatch-only jobs receive package-write
  # authority only after every required build and smoke gate succeeds.
  # ---------------------------------------------------------------------------
  docker:
    name: Build image (PostgreSQL ${{ matrix.pg }}, ${{ matrix.arch }})
    needs: [prep, notices, lint, meta, deb, compatibility, homebrew-policy]
    runs-on: ${{ matrix.runner }}
    # Every declared major is required; missing provisioning must fail.
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 16, 17, 18]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          # The BM25 provider (pg_textsearch) ships for 17 and 18 only; those
          # legs require it (WITH_PG_TEXTSEARCH=1, so a stale checksum table
          # fails the build instead of silently publishing a provider-less
          # image), the others build with auto (skips) and the smoke test
          # adapts.
    env:
      VERSION: ${{ needs.prep.outputs.version }}
      LOCAL_TAG: pgokf:${{ needs.prep.outputs.version }}-pg${{ matrix.pg }}
      WITH_PG_TEXTSEARCH: ${{ (matrix.pg == 17 || matrix.pg == 18) && '1' || 'auto' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prep.outputs.source_ref }}

      - name: Checkout release validation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: release-tools

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Exclude verification checkout from selected-source build context
        run: printf '\nrelease-tools/\n' >> .dockerignore

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check base-image availability
        id: base
        run: |
          if docker manifest inspect "postgres:${{ matrix.pg }}" >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::postgres:${{ matrix.pg }} base image is missing (required leg)."
            exit 1
          fi

      - name: Build image (native ${{ matrix.arch }})
        if: steps.base.outputs.available == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          build-args: |
            PG_MAJOR=${{ matrix.pg }}
            RUST_VERSION=${{ env.RUST_TOOLCHAIN }}
            CARGO_PGRX_VERSION=${{ env.CARGO_PGRX_VERSION }}
            PGOKF_VERSION=${{ env.VERSION }}
            WITH_PG_TEXTSEARCH=${{ env.WITH_PG_TEXTSEARCH }}
          tags: ${{ env.LOCAL_TAG }}
          push: false
          load: true

      # End-to-end: preload every optional extension, apply env-driven roles and
      # policy, register the sample bundle, search, back up. The script is the
      # same one operators run locally (packaging/docker/README.md).
      - name: Smoke test image
        if: steps.base.outputs.available == 'true'
        run: cargo run --locked --manifest-path release-tools/Cargo.toml -p pgokf-verifier -- image-smoke . "$LOCAL_TAG" "$VERSION" optional "$RUNNER_TEMP/server-smoke-evidence"

      - name: Export the smoke-tested image
        if: steps.base.outputs.available == 'true' && needs.prep.outputs.publish == 'true'
        run: docker save "$LOCAL_TAG" --output "$RUNNER_TEMP/server-image.tar"

      - name: Upload the smoke-tested image
        if: steps.base.outputs.available == 'true' && needs.prep.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-server-pg${{ matrix.pg }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/server-image.tar
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    name: Publish image digest (PostgreSQL ${{ matrix.pg }}, ${{ matrix.arch }})
    needs: [prep, notices, docker]
    if: needs.prep.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 16, 17, 18]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.prep.outputs.version }}
      LOCAL_TAG: pgokf:${{ needs.prep.outputs.version }}-pg${{ matrix.pg }}
    steps:
      - name: Download smoke-tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-server-pg${{ matrix.pg }}-${{ matrix.arch }}
          path: /tmp/image
      - name: Load smoke-tested image
        run: docker load --input /tmp/image/server-image.tar
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push smoke-tested image and export digest
        env:
          ARCH_TAG: ${{ env.SERVER_IMAGE }}:${{ needs.prep.outputs.version }}-pg${{ matrix.pg }}-${{ matrix.arch }}
          DIGEST_DIRECTORY: /tmp/digests
        run: |
          docker tag "$LOCAL_TAG" "$ARCH_TAG"
          docker push "$ARCH_TAG"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$ARCH_TAG")
          [[ $reference == "${SERVER_IMAGE}@sha256:"* ]]
          digest=${reference#*@}
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$DIGEST_DIRECTORY"
          touch "$DIGEST_DIRECTORY/${digest#sha256:}"
          echo "pushed ${reference} (${{ matrix.arch }}, pg${{ matrix.pg }})"
      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-server-pg${{ matrix.pg }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Merge the per-architecture digests of each major into the one tag users
  # pull: ghcr.io/logicocean/pgokf:<version>-pg<major> (linux/amd64 +
  # linux/arm64).
  # ---------------------------------------------------------------------------
  docker-manifest:
    name: Publish multi-arch manifest (PostgreSQL ${{ matrix.pg }})
    needs: [prep, notices, docker-publish, companions-publish]
    if: needs.prep.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    # Every declared major is required; missing provisioning must fail.
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 16, 17, 18]
    env:
      TAG: ghcr.io/logicocean/pgokf:${{ needs.prep.outputs.version }}-pg${{ matrix.pg }}
    steps:
      - name: Download per-arch digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-server-pg${{ matrix.pg }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and inspect the manifest list
        run: |
          shopt -s nullglob
          digests=(/tmp/digests/*)
          [[ ${#digests[@]} -eq 2 ]]
          for d in "${digests[@]}"; do
            [[ -f $d && ! -L $d && ! -s $d ]]
            [[ $(basename "$d") =~ ^[0-9a-f]{64}$ ]]
          done
          refs=()
          for d in "${digests[@]}"; do refs+=("${SERVER_IMAGE}@sha256:$(basename "$d")"); done
          docker buildx imagetools create -t "$TAG" "${refs[@]}"
          docker buildx imagetools inspect "$TAG"

  # ---------------------------------------------------------------------------
  # The companions image (pgokf-ingest / pgokf-embed / pgokf-mcp), likewise
  # native per architecture and merged into ghcr.io/logicocean/pgokf-companions:<version>.
  # ---------------------------------------------------------------------------
  companions:
    name: Build companions image (${{ matrix.arch }})
    needs: [prep, notices, lint, meta, deb, compatibility, homebrew-policy]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.prep.outputs.version }}
      LOCAL_TAG: pgokf-companions:${{ needs.prep.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prep.outputs.source_ref }}

      - name: Checkout release validation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: release-tools

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Exclude verification checkout from selected-source build context
        run: printf '\nrelease-tools/\n' >> .dockerignore

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (native ${{ matrix.arch }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile.companions
          build-args: |
            RUST_VERSION=${{ env.RUST_TOOLCHAIN }}
          tags: ${{ env.LOCAL_TAG }}
          push: false
          load: true

      - name: Smoke test image
        run: cargo run --locked --manifest-path release-tools/Cargo.toml -p pgokf-verifier -- companions-smoke "$LOCAL_TAG" "$RUNNER_TEMP/companions-smoke-evidence"

      - name: Export the smoke-tested image
        if: needs.prep.outputs.publish == 'true'
        run: docker save "$LOCAL_TAG" --output "$RUNNER_TEMP/companions-image.tar"

      - name: Upload the smoke-tested image
        if: needs.prep.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-companions-${{ matrix.arch }}
          path: ${{ runner.temp }}/companions-image.tar
          if-no-files-found: error
          retention-days: 1

  companions-publish:
    name: Publish companions image digest (${{ matrix.arch }})
    needs: [prep, notices, companions]
    if: needs.prep.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      LOCAL_TAG: pgokf-companions:${{ needs.prep.outputs.version }}
    steps:
      - name: Download smoke-tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-companions-${{ matrix.arch }}
          path: /tmp/image
      - name: Load smoke-tested image
        run: docker load --input /tmp/image/companions-image.tar
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push smoke-tested image and export digest
        env:
          ARCH_TAG: ${{ env.COMPANIONS_IMAGE }}:${{ needs.prep.outputs.version }}-${{ matrix.arch }}
          DIGEST_DIRECTORY: /tmp/digests
        run: |
          docker tag "$LOCAL_TAG" "$ARCH_TAG"
          docker push "$ARCH_TAG"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$ARCH_TAG")
          [[ $reference == "${COMPANIONS_IMAGE}@sha256:"* ]]
          digest=${reference#*@}
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$DIGEST_DIRECTORY"
          touch "$DIGEST_DIRECTORY/${digest#sha256:}"
          echo "pushed ${reference} (${{ matrix.arch }})"
      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-companions-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  companions-manifest:
    name: Publish multi-arch companions manifest
    needs: [prep, notices, docker-publish, companions-publish]
    if: needs.prep.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      TAG: ghcr.io/logicocean/pgokf-companions:${{ needs.prep.outputs.version }}
    steps:
      - name: Download per-arch digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-companions-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and inspect the manifest list
        run: |
          shopt -s nullglob
          digests=(/tmp/digests/*)
          [[ ${#digests[@]} -eq 2 ]]
          for d in "${digests[@]}"; do
            [[ -f $d && ! -L $d && ! -s $d ]]
            [[ $(basename "$d") =~ ^[0-9a-f]{64}$ ]]
          done
          refs=()
          for d in "${digests[@]}"; do refs+=("${COMPANIONS_IMAGE}@sha256:$(basename "$d")"); done
          docker buildx imagetools create -t "$TAG" "${refs[@]}"
          docker buildx imagetools inspect "$TAG"

  compatibility:
    needs: prep
    uses: ./.github/workflows/pgrx-test.yml
    with:
      source_ref: ${{ needs.prep.outputs.source_ref }}

  homebrew-policy:
    runs-on: macos-15
    steps:
      - name: Checkout release validation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: release-tools

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.96.0"
      - name: Execute actual Homebrew environment policy
        run: cargo run --locked --manifest-path release-tools/Cargo.toml -p pgokf-verifier -- homebrew-policy release-tools
