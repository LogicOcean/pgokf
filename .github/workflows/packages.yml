name: packages

# Build the distributable artifacts for every supported PostgreSQL major.
# Runs on tags (a release) and on demand; also on pushes touching packaging so
# the build scripts stay green.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "packaging/**"
      - "META.json"
      - ".github/workflows/packages.yml"
  pull_request:
    paths:
      - "packaging/**"
      - "META.json"
      - ".github/workflows/packages.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in sync with rust-toolchain.toml and the workspace pgrx dependency.
  RUST_TOOLCHAIN: "1.96.0"
  CARGO_PGRX_VERSION: "0.19.2"

jobs:
  # ---------------------------------------------------------------------------
  # META.json is PG-independent; validate it once.
  # ---------------------------------------------------------------------------
  meta:
    name: Validate META.json (PGXN)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: jq well-formedness + required PGXN v1 fields
        run: |
          jq empty META.json
          jq -e '
            has("name") and has("version") and has("abstract")
            and has("maintainer") and has("license") and has("provides")
            and has("meta-spec")
            and (.provides | to_entries | all(.value | has("file") and has("version")))
          ' META.json
          echo "META.json: valid JSON, all required PGXN meta-spec v1 fields present."

      # The main SQL named by provides.*.file is a generated build artifact
      # (target/, gitignored); the PGXN release process emits it into the tree
      # before zipping (see docs/packaging.md). Reproduce that emit here so the
      # manifest's promised file is proven to exist at dist-build time, rather
      # than only when a human runs the release steps.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install PostgreSQL 18 dev files (PGDG)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --batch --yes --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-server-dev-18 libclang-dev

      - name: Install cargo-pgrx and initialize PostgreSQL 18
        run: |
          cargo install --locked cargo-pgrx --version "${CARGO_PGRX_VERSION}"
          cargo pgrx init --pg18=/usr/lib/postgresql/18/bin/pg_config

      - name: Emit generated SQL and assert every provides.file exists
        run: |
          # Emit the main SQL exactly as the PGXN release process does
          # (docs/packaging.md), targeting the path the manifest promises.
          target=$(jq -r '.provides.pgokf.file' META.json)
          mkdir -p "$(dirname "$target")"
          ( cd crates/extension && cargo pgrx schema pg18 ) > "$target"
          # Every path named by provides.*.file must now exist in the tree.
          mapfile -t provided_files < <(jq -r '.provides[].file' META.json)
          for f in "${provided_files[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::provides.file '$f' does not exist at dist-build time"
              exit 1
            fi
            echo "provides.file present: $f"
          done

  # ---------------------------------------------------------------------------
  # Per-major .deb (+ rpm spec check). PG19 is advisory until PGDG ships it.
  # ---------------------------------------------------------------------------
  deb:
    name: Build .deb (PostgreSQL ${{ matrix.pg }})${{ matrix.experimental && ' (advisory)' || '' }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 16, 17, 18]
        experimental: [false]
        include:
          - pg: 19
            experimental: true
    steps:
      - uses: actions/checkout@v4

      # Pinned via the action ref (1.96.0), consistent with ci.yml and
      # pgrx-test.yml; RUST_TOOLCHAIN below documents the same version for the
      # Docker build args.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install PostgreSQL ${{ matrix.pg }} server + dev files (PGDG)
        id: pgdg
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --batch --yes --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          # PG19 is not GA as of 2026-08; PGDG publishes no postgresql-19 yet.
          # Skip the advisory leg gracefully; a required leg fails loudly.
          if ! apt-cache show "postgresql-${{ matrix.pg }}" > /dev/null 2>&1; then
            if [[ "${{ matrix.experimental }}" == "true" ]]; then
              echo "::notice::postgresql-${{ matrix.pg }} not published by PGDG yet; skipping advisory leg."
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::postgresql-${{ matrix.pg }} is required but missing from PGDG."
            exit 1
          fi
          # An advisory leg may be only partially published (apt metadata
          # present but dev packages not installable, as with PostgreSQL 19
          # pre-GA); skip it gracefully rather than failing. Required legs fail.
          if ! sudo apt-get install -y \
            postgresql-${{ matrix.pg }} \
            postgresql-server-dev-${{ matrix.pg }} \
            libclang-dev; then
            if [[ "${{ matrix.experimental }}" == "true" ]]; then
              echo "::notice::postgresql-${{ matrix.pg }} is not fully installable yet; skipping this advisory leg."
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::failed to install postgresql-${{ matrix.pg }} (required leg)."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Install cargo-pgrx and initialize PostgreSQL ${{ matrix.pg }}
        if: steps.pgdg.outputs.available == 'true'
        run: |
          cargo install --locked cargo-pgrx --version "${CARGO_PGRX_VERSION}"
          cargo pgrx init --pg${{ matrix.pg }}=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

      # Uses the single build primitive internally (cargo pgrx package for this
      # major, package-scoped to the extension crate) then dpkg-deb --build.
      - name: Build .deb
        if: steps.pgdg.outputs.available == 'true'
        run: packaging/deb/build-deb.sh ${{ matrix.pg }}

      - name: Inspect .deb (metadata + payload)
        if: steps.pgdg.outputs.available == 'true'
        run: |
          deb=$(ls target/packaging/deb/postgresql-${{ matrix.pg }}-pgokf_*.deb)
          echo "== dpkg-deb -I =="; dpkg-deb -I "$deb"
          echo "== dpkg-deb -c =="; dpkg-deb -c "$deb"

      - name: Smoke test .deb (CREATE EXTENSION on a scratch cluster)
        if: steps.pgdg.outputs.available == 'true'
        run: |
          # apt only treats a local .deb argument as a file when the path is
          # absolute or ./-prefixed; a bare relative path (target/...) is parsed
          # as a package name and fails with "Unable to locate package". Resolve
          # to an absolute path so `apt-get install` installs the built file.
          deb=$(ls "$PWD"/target/packaging/deb/postgresql-${{ matrix.pg }}-pgokf_*.deb)
          sudo apt-get install -y "$deb"
          PGBIN=/usr/lib/postgresql/${{ matrix.pg }}/bin
          DATA=/tmp/pgokf-ci/data; SOCK=/tmp/pgokf-ci/s
          rm -rf /tmp/pgokf-ci && mkdir -p "$DATA" "$SOCK"
          "$PGBIN/initdb" -D "$DATA" -U postgres --auth=trust >/dev/null
          "$PGBIN/pg_ctl" -D "$DATA" -o "-c listen_addresses='' -k $SOCK" -w start
          "$PGBIN/psql" -h "$SOCK" -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION pgokf;" \
            -c "SELECT extname, extversion FROM pg_extension WHERE extname='pgokf';"
          "$PGBIN/pg_ctl" -D "$DATA" -w stop

      - name: Structurally check the RPM spec
        if: steps.pgdg.outputs.available == 'true' && matrix.pg == 18
        run: |
          # rpmspec is not installed on ubuntu runners by default; use it if
          # present (full macro parse), otherwise assert the required sections.
          if command -v rpmspec >/dev/null 2>&1; then
            rpmspec --parse --define 'pgmajorversion 16' packaging/rpm/pgokf.spec >/dev/null
            echo "rpmspec --parse: OK"
          else
            for s in '^Name:' '^Version:' '^%build' '^%install' '^%files'; do
              grep -qE "$s" packaging/rpm/pgokf.spec || { echo "missing $s"; exit 1; }
            done
            echo "rpmspec unavailable; required spec sections present."
          fi

      - name: Upload .deb artifact
        if: steps.pgdg.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pgokf-deb-pg${{ matrix.pg }}
          path: target/packaging/deb/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Per-major Docker image. Build only (loaded locally); push happens in the
  # release step, not here.
  # ---------------------------------------------------------------------------
  docker:
    name: Build Docker image (PostgreSQL ${{ matrix.pg }})${{ matrix.experimental && ' (advisory)' || '' }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 16, 17, 18]
        experimental: [false]
        include:
          - pg: 19
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Resolve extension version and base-image availability
        id: prep
        run: |
          # The extension's control file is the single source of truth for the
          # released version (same source build-deb.sh reads); never hard-code it.
          version=$(sed -n "s/^default_version *= *'\([^']*\)'.*/\1/p" crates/extension/pgokf.control)
          [ -n "$version" ] || { echo "::error::could not read default_version from pgokf.control"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "resolved extension version: $version"
          # The Dockerfile builds FROM postgres:${PG_MAJOR}; that base image does
          # not exist for a pre-GA major (e.g. 19). Skip an advisory leg cleanly
          # rather than failing docker build --check on a missing base.
          if docker manifest inspect "postgres:${{ matrix.pg }}" >/dev/null 2>&1; then
            echo "base_available=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ matrix.experimental }}" == "true" ]]; then
            echo "::notice::postgres:${{ matrix.pg }} base image is not published yet; skipping this advisory leg."
            echo "base_available=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::postgres:${{ matrix.pg }} base image is missing (required leg)."
            exit 1
          fi

      - name: Validate Dockerfile
        if: steps.prep.outputs.base_available == 'true'
        run: |
          docker build --check \
            -f packaging/docker/Dockerfile \
            --build-arg PG_MAJOR=${{ matrix.pg }} .

      - name: Build image
        if: steps.prep.outputs.base_available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          build-args: |
            PG_MAJOR=${{ matrix.pg }}
            RUST_VERSION=${{ env.RUST_TOOLCHAIN }}
            CARGO_PGRX_VERSION=${{ env.CARGO_PGRX_VERSION }}
          tags: ghcr.io/logicocean/pgokf:${{ steps.prep.outputs.version }}-pg${{ matrix.pg }}
          push: false
          load: true

      - name: Smoke test image (register sample bundle + assert a concept row)
        if: steps.prep.outputs.base_available == 'true'
        run: |
          VER='${{ steps.prep.outputs.version }}'
          # Mount the repo's sample OKF bundle where the server process can read
          # it, so the smoke exercises the real pipeline end to end -- not just
          # that CREATE EXTENSION succeeds. The bootstrap superuser passes the
          # pgokf_admin check (pg_has_role), so register_bundle is authorized.
          cid=$(docker run -d -e POSTGRES_PASSWORD=postgres \
            -v "$PWD/examples/sample-bundle:/bundles/sample:ro" \
            "ghcr.io/logicocean/pgokf:${VER}-pg${{ matrix.pg }}")
          # Wait until the extension is actually created at the expected version,
          # not merely until the socket accepts connections. The postgres image
          # runs /docker-entrypoint-initdb.d (CREATE EXTENSION) during init, and a
          # slow container can leave a window where pg_isready is up but the init
          # script has not finished - polling only pg_isready then querying once
          # races and flakes. Poll the real condition with an explicit timeout so
          # a slow leg fails loudly instead of reading an empty version.
          ready=""
          for i in $(seq 1 60); do
            got=$(docker exec "$cid" psql -U postgres -tAc \
              "SELECT extversion FROM pg_extension WHERE extname='pgokf'" 2>/dev/null \
              | tr -d '[:space:]' || true)
            if [ "$got" = "$VER" ]; then ready=1; break; fi
            sleep 2
          done
          [ -n "$ready" ] \
            || { echo "::error::pgokf extension not present at ${VER} after 120s"; docker logs "$cid"; docker rm -f "$cid"; exit 1; }
          # Register the mounted bundle and materialize its concepts. Call the
          # function in the FROM clause, not as (register_bundle(...)).*: the
          # composite-star form re-evaluates the volatile function once per
          # output column, so the second evaluation fails with "already
          # registered". FROM evaluates it exactly once.
          docker exec "$cid" psql -U postgres -v ON_ERROR_STOP=1 \
            -c "SELECT * FROM pgokf.register_bundle('/bundles/sample');"
          # Assert at least one concept row landed in the catalog.
          n=$(docker exec "$cid" psql -U postgres -tAc "SELECT count(*) FROM pgokf.concepts;")
          echo "concept rows materialized: ${n}"
          docker rm -f "$cid"
          test "${n}" -gt 0 \
            || { echo "::error::no concept rows materialized from the sample bundle"; exit 1; }
