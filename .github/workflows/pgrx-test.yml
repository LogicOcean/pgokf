name: pgrx test

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    name: PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-24.04
    # Every declared major is required; missing provisioning must fail.
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 16, 17, 18]
        include:
          - pg: 19
            image_tag: 19beta3

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Checkout release validation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-tools

      - name: Validate source compatibility identity
        run: python3 release-tools/scripts/compatibility-source.py .

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.96.0"
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify immutable Beta 3 base
        if: matrix.pg == 19
        run: release-tools/packaging/check-beta-image.sh

      - name: Install PostgreSQL ${{ matrix.pg }} development files
        id: pgdg
        run: |
          sudo release-tools/packaging/install-postgres.sh ${{ matrix.pg }}
          echo "available=true" >> "$GITHUB_OUTPUT"

      # pg_textsearch (the default BM25 provider) ships for 17 and 18 only.
      # Install its pinned, checksum-verified package on those legs - through
      # the same script the image build uses - so the in-database provider
      # tests run for real there (PGOKF_TEST_PRELOAD below) instead of
      # skipping everywhere.
      - name: Install pg_textsearch (BM25 provider tests)
        if: steps.pgdg.outputs.available == 'true' && (matrix.pg == 17 || matrix.pg == 18)
        run: |
          deb="$(release-tools/packaging/docker/fetch-pg-textsearch.sh ${{ matrix.pg }} amd64 "${RUNNER_TEMP}")"
          sudo apt-get install -y --no-install-recommends "${deb}"

      # Keep this version synchronized with the workspace `pgrx` dependency in
      # the root Cargo.toml (currently 0.19.2).
      - name: Install and initialize cargo-pgrx
        if: steps.pgdg.outputs.available == 'true'
        run: |
          cargo install --locked cargo-pgrx --version 0.19.2
          cargo pgrx init --pg${{ matrix.pg }}=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

      # `cargo pgrx test` builds the extension and installs it into the system
      # PostgreSQL's package-library and extension directories (it uses the
      # system pg_config from the init step above). On the GitHub runner those
      # directories are root-owned, so `cargo pgrx test` fails copying the .so
      # with `Permission denied (os error 13)` unless the runner owns them.
      # Hand both to the runner user before testing.
      - name: Grant the runner write access to the PostgreSQL install dirs
        if: steps.pgdg.outputs.available == 'true'
        run: |
          PGCONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
          sudo chown -R "$(id -u):$(id -g)" \
            "$("$PGCONFIG" --pkglibdir)" \
            "$("$PGCONFIG" --sharedir)/extension"

      # --no-default-features pins each leg to exactly one pgNN feature, so the
      # crate's default PostgreSQL feature is irrelevant here.
      - name: Clippy
        if: steps.pgdg.outputs.available == 'true'
        run: cargo clippy --locked -p pgokf --no-default-features --features pg${{ matrix.pg }} --all-targets -- -D warnings

      # `cargo pgrx test` resolves the extension crate from the working
      # directory and appends the `pg_test` feature itself.
      #
      # RUST_TEST_THREADS=1: pgrx wraps each `#[pg_test]` in one long-lived
      # transaction, so tests that both touch the singleton `pgokf_private.config`
      # row (e.g. set_config) can deadlock against each other under the default
      # parallel harness. Running the in-DB suite single-threaded is
      # deterministic; it does not reflect any production concurrency issue
      # (real set_config runs in its own short transaction).
      #
      # PGOKF_TEST_PRELOAD preloads the provider into pgrx's throwaway instance
      # on the legs that installed it; with it set, the provider tests fail
      # rather than skip if the provider turns out to be unusable.
      - name: Test
        if: steps.pgdg.outputs.available == 'true'
        working-directory: crates/extension
        env:
          RUST_TEST_THREADS: "1"
          PGOKF_TEST_PRELOAD: ${{ (matrix.pg == 17 || matrix.pg == 18) && 'pg_textsearch' || '' }}
        run: cargo pgrx test pg${{ matrix.pg }} --release --no-default-features --features pg${{ matrix.pg }}

      - name: Fresh install versus upgrade parity and mutation probes
        if: steps.pgdg.outputs.available == 'true' && matrix.pg == 18
        run: |
          PG_CONFIG=/usr/lib/postgresql/18/bin/pg_config
          cargo pgrx install --no-default-features --features pg18 --pg-config "$PG_CONFIG"
          release-tools/scripts/compatibility-parity.sh "$PG_CONFIG"

      - name: Nonproduction PostgreSQL 19 Beta 3 image compatibility
        if: matrix.pg == 19
        run: |
          python3 release-tools/scripts/compatibility-image.py
          version=$(sed -n "s/^default_version *= *'\([^']*\)'.*/\1/p" crates/extension/pgokf.control)
          SMOKE_WITH_OPTIONAL=0 release-tools/packaging/docker/smoke-test.sh pgokf-beta-compat "$version"
