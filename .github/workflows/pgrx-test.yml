name: pgrx test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PostgreSQL ${{ matrix.pg }}${{ matrix.experimental && ' (advisory)' || '' }}
    runs-on: ubuntu-24.04
    # Advisory legs (currently PostgreSQL 19) may fail without failing the
    # workflow; the required legs (15-18) must always pass.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 16, 17, 18]
        experimental: [false]
        include:
          # PostgreSQL 19 is not GA as of 2026-08 and PGDG publishes no
          # postgresql-19 apt package yet. Keep the leg visible so it starts
          # passing as soon as PGDG ships packages, but do not let it block CI.
          - pg: 19
            experimental: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.96.0"
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install PostgreSQL ${{ matrix.pg }} development files
        id: pgdg
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --batch --yes --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          # PostgreSQL 19 is not GA as of 2026-08, so PGDG does not publish a
          # postgresql-19 package yet. Skip the advisory leg gracefully instead
          # of hard-failing on `apt-get install`; a required leg with a missing
          # package still fails loudly.
          if ! apt-cache show "postgresql-${{ matrix.pg }}" > /dev/null 2>&1; then
            if [[ "${{ matrix.experimental }}" == "true" ]]; then
              echo "::notice::postgresql-${{ matrix.pg }} is not published by PGDG yet; skipping this advisory leg."
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::postgresql-${{ matrix.pg }} is required but missing from PGDG."
            exit 1
          fi
          # A required leg must install cleanly; an advisory leg may be only
          # partially published (apt metadata present but the dev packages not
          # yet installable, as with PostgreSQL 19 pre-GA) - skip it gracefully
          # rather than showing a spurious red, matching the guard above.
          if ! sudo apt-get install -y \
            postgresql-${{ matrix.pg }} \
            postgresql-server-dev-${{ matrix.pg }} \
            libclang-dev; then
            if [[ "${{ matrix.experimental }}" == "true" ]]; then
              echo "::notice::postgresql-${{ matrix.pg }} is not fully installable yet; skipping this advisory leg."
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::failed to install postgresql-${{ matrix.pg }} (required leg)."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      # Keep this version synchronized with the workspace `pgrx` dependency in
      # the root Cargo.toml (currently 0.19.2).
      - name: Install and initialize cargo-pgrx
        if: steps.pgdg.outputs.available == 'true'
        run: |
          cargo install --locked cargo-pgrx --version 0.19.2
          cargo pgrx init --pg${{ matrix.pg }}=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

      # `cargo pgrx test` builds the extension and installs it into the system
      # PostgreSQL's package-library and extension directories (it uses the
      # system pg_config from the init step above). On the GitHub runner those
      # directories are root-owned, so `cargo pgrx test` fails copying the .so
      # with `Permission denied (os error 13)` unless the runner owns them.
      # Hand both to the runner user before testing.
      - name: Grant the runner write access to the PostgreSQL install dirs
        if: steps.pgdg.outputs.available == 'true'
        run: |
          PGCONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
          sudo chown -R "$(id -u):$(id -g)" \
            "$("$PGCONFIG" --pkglibdir)" \
            "$("$PGCONFIG" --sharedir)/extension"

      # --no-default-features pins each leg to exactly one pgNN feature, so the
      # crate's default PostgreSQL feature is irrelevant here.
      - name: Clippy
        if: steps.pgdg.outputs.available == 'true'
        run: cargo clippy -p pgokf --no-default-features --features pg${{ matrix.pg }} --all-targets -- -D warnings

      # `cargo pgrx test` resolves the extension crate from the working
      # directory and appends the `pg_test` feature itself.
      #
      # RUST_TEST_THREADS=1: pgrx wraps each `#[pg_test]` in one long-lived
      # transaction, so tests that both touch the singleton `pgokf_private.config`
      # row (e.g. set_config) can deadlock against each other under the default
      # parallel harness. Running the in-DB suite single-threaded is
      # deterministic; it does not reflect any production concurrency issue
      # (real set_config runs in its own short transaction).
      - name: Test
        if: steps.pgdg.outputs.available == 'true'
        working-directory: crates/extension
        env:
          RUST_TEST_THREADS: "1"
        run: cargo pgrx test pg${{ matrix.pg }} --no-default-features --features pg${{ matrix.pg }}
