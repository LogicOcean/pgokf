name: pgrx tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pgrx:
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17]
    runs-on: ubuntu-22.04
    env:
      PG_MAJOR: ${{ matrix.pg }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: pgrx-pg${{ matrix.pg }}
      - name: Install PostgreSQL ${{ matrix.pg }} and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release build-essential libclang-dev
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-${PG_MAJOR} postgresql-server-dev-${PG_MAJOR}
      - name: Initialize pgrx
        run: |
          cargo install cargo-pgrx --version =0.14.3 --locked
          cargo pgrx init --pg${PG_MAJOR} /usr/lib/postgresql/${PG_MAJOR}/bin/pg_config
      - name: Test extension
        run: cargo pgrx test --manifest-path crates/extension/Cargo.toml --no-default-features --features pg${PG_MAJOR}
