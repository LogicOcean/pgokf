name: CI

on:
  push:
  pull_request:
  # Manual re-run at the current HEAD. After a platform incident leaves a
  # queued run with no dispatched jobs, it can be neither cancelled nor
  # re-run; this trigger is the recovery path that avoids a placeholder
  # commit just to re-fire CI.
  workflow_dispatch:

permissions:
  contents: read

# Bind the system Bash independently of PATH after removing startup hooks.
defaults:
  run:
    shell: /usr/bin/env -u BASH_ENV -u ENV /bin/bash --noprofile --norc -e -o pipefail {0}

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the historical-source guard executes the
      # pinned immutable release tags (the Rust workflow verifier enforces this).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Ruby formula observation runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby
      - name: Test required PostgreSQL coverage guards
        run: |
          cargo test --locked -p pgokf-verifier
          cargo run --locked -p pgokf-verifier -- history-check .
          cargo run --locked -p pgokf-verifier -- release-check .
          cargo run --locked -p pgokf-verifier -- workflow-check .
      - name: Reject repository-owned non-Rust verification
        run: cargo run --locked -p pgokf-verifier -- source-guard .
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --exclude pgokf --all-targets -- -D warnings
      - run: cargo test --locked --workspace --exclude pgokf

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # COMM-LICENSE.md section 5 promises commercial licensees a third-party
  # notices file with every release, and the .deb/.rpm builds install it. A
  # dependency change that is not reflected in the committed file would make
  # that promise false, so regenerate and fail on any drift.
  notices:
    name: Third-party notices are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install checksum-pinned cargo-about
        run: scripts/install-cargo-about.sh "$RUNNER_TEMP/cargo-about"
      # cargo-about resolves the complete workspace under --frozen while this
      # job only builds pgokf-verifier; the remaining lockfile entries must be
      # prefetched with the identical --locked resolution.
      - name: Prefetch locked workspace dependencies
        run: cargo fetch --locked
      - name: Verify deterministic third-party notices
        run: cargo run --locked -p pgokf-verifier -- notices-verify . "$RUNNER_TEMP/cargo-about"

  homebrew-policy:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.96.0"
      - name: Execute actual Homebrew environment policy
        run: cargo run --locked -p pgokf-verifier -- homebrew-policy .
