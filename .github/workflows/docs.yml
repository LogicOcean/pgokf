name: Docs

# Build the MkDocs Material site on every main push. Publish it only from a
# manual dispatch whose operator explicitly opts in below.
#
# The build runs with `--strict`, so a missing nav page or a broken internal
# link fails CI rather than silently shipping a broken site.

on:
  push:
    branches: [main]
  # Manual publication is fail-closed unless the operator explicitly opts in.
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Manually deploy the successfully built site to GitHub Pages
        required: true
        type: boolean
        default: false

# Build and policy jobs only need repository read access. Deployment permissions
# are granted only to the gated deploy job below.
permissions:
  contents: read

jobs:
  pages-policy:
    name: Resolve Pages deployment policy
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.policy.outputs.version }}
      deploy: ${{ steps.policy.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve manual-only Pages deployment policy
        id: policy
        env:
          INPUT_DEPLOY_PAGES: ${{ inputs.deploy_pages }}
        run: cargo metadata --locked --no-deps --format-version 1 | bash scripts/pages-deploy-policy.sh

  build:
    name: Build (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Stage repo-root changelog into docs/
        # MkDocs cannot include files above docs_dir, so surface CHANGELOG.md as
        # docs/changelog.md (referenced by the nav) just before the build. The
        # changelog lives at the repo root, so (1) links to other repo-root
        # documents (licenses, security policy, ...) that are not part of the
        # site become absolute GitHub links, and (2) its root-relative "docs/…"
        # links are rebased to be docs_dir-relative once the file is relocated
        # into docs/ - otherwise `--strict` rejects them as broken links.
        run: |
          sed -E \
            -e 's#\]\((\./)?(LICENSE|LICENSING\.md|COMM-LICENSE\.md|SECURITY\.md|CONTRIBUTING\.md|CODE_OF_CONDUCT\.md|README\.md|THIRD-PARTY-NOTICES\.txt)\)#](https://github.com/LogicOcean/pgokf/blob/main/\2)#g' \
            -e 's#\]\((\./)?docs/#](#g' \
            CHANGELOG.md > docs/changelog.md

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, pages-policy]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_pages == true && needs.build.result == 'success' && needs.pages-policy.result == 'success' && needs.pages-policy.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Serialize deployments without suppressing strict builds for queued pushes.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
