name: Docs

# Build and publish the MkDocs Material site to GitHub Pages.
#
# The build runs with `--strict`, so a missing nav page or a broken internal
# link fails CI rather than silently shipping a broken site.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Least-privilege token: Pages deployment needs pages:write + id-token:write.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments; never cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Stage repo-root changelog into docs/
        # MkDocs cannot include files above docs_dir, so surface CHANGELOG.md as
        # docs/changelog.md (referenced by the nav) just before the build. The
        # changelog lives at the repo root, so (1) links to other repo-root
        # documents (licenses, security policy, ...) that are not part of the
        # site become absolute GitHub links, and (2) its root-relative "docs/…"
        # links are rebased to be docs_dir-relative once the file is relocated
        # into docs/ - otherwise `--strict` rejects them as broken links.
        run: |
          sed -E \
            -e 's#\]\((\./)?(LICENSE|LICENSING\.md|COMM-LICENSE\.md|SECURITY\.md|CONTRIBUTING\.md|CODE_OF_CONDUCT\.md|README\.md|THIRD-PARTY-NOTICES\.txt)\)#](https://github.com/LogicOcean/pgokf/blob/main/\2)#g' \
            -e 's#\]\((\./)?docs/#](#g' \
            CHANGELOG.md > docs/changelog.md

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
