[package]
name = "pgokf-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Web UI and JSON API companion for the pgokf catalog: search, browse, inspect, and monitor through the reader role."
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["database", "web-programming::http-server"]

[[bin]]
name = "pgokf-web"
path = "src/main.rs"

[dependencies]
ammonia = "4.0"
anyhow = "1.0"
askama = { version = "0.13", features = ["urlencode"] }
# Already linked through rustls and jsonwebtoken; here it seals an identity
# provider's client secret at rest (AES-256-GCM under an HKDF-derived key).
aws-lc-rs = "1"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
axum = { version = "0.8", default-features = false, features = [
    "form",
    "http1",
    "json",
    "multipart",
    "query",
    "tokio",
] }
base64 = "0.23"
clap = { version = "4.5", features = ["derive", "env"] }
deadpool-postgres = "0.14"
getrandom = "0.4"
hmac = "0.13"
# Reuses the aws-lc-rs already linked through rustls, so verifying an ID
# token adds no second cryptographic implementation.
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
okf-parser = { version = "=0.3.0", path = "../okf-parser" }
pgokf-companion = { version = "=0.3.0", path = "../pgokf-companion", features = [
    "documents",
    "embeddings",
    "mcp-token",
] }
pgokf-pgconn = { version = "=0.3.0", path = "../pgokf-pgconn" }
pgokf-workspace = { version = "=0.3.0", path = "../pgokf-workspace" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2 = "0.11"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tower = { version = "0.5", features = ["limit"] }

[dev-dependencies]
# `ServiceExt::oneshot` drives the real router in the route tests.
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
