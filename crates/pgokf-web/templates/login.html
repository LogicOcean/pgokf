{% extends "base.html" %}
{% block content %}
<section class="panel narrow">
  <div class="panel-head"><h2>Sign in</h2></div>
  {% if let Some(e) = error %}<p class="notice bad">{{ e }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field">
      <label for="l-user">User name</label>
      <input id="l-user" type="text" name="username" autocomplete="username" required autofocus spellcheck="false">
    </div>
    <div class="field">
      <label for="l-pass">Password</label>
      <input id="l-pass" type="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn primary">Sign in</button>
  </form>
  <p class="hint">Signing in unlocks what your role allows: uploading documents, editing them, or approving them. Everything else stays readable without an account.</p>
</section>
{% endblock %}
