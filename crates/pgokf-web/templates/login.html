{% extends "base.html" %}
{% block header %}{% endblock %}
{% block content %}
<div class="login-stage">
  <section class="panel login">
    <div class="login-brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">catalog</span></div>
    <h2>Sign in</h2>
    {% if let Some(e) = error %}<p class="notice bad">{{ e }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="l-user">User name</label>
        <input id="l-user" type="text" name="username" autocomplete="username" required autofocus spellcheck="false">
      </div>
      <div class="field">
        <label for="l-pass">Password</label>
        <input id="l-pass" type="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn primary wide">Sign in</button>
    </form>
    <p class="hint">Signing in unlocks what your role allows: uploading documents, editing them, or approving them.</p>
  </section>
</div>
{% endblock %}
