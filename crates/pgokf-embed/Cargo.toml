[package]
name = "pgokf-embed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reference embedding-generation companion for pgokf: computes concept embeddings against any OpenAI-compatible endpoint and streams them into pgokf.set_concept_embedding."

[[bin]]
name = "pgokf-embed"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7"

[lints]
workspace = true
