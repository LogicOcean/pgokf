[package]
name = "pgokf-embed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reference embedding-generation companion for pgokf: computes concept embeddings against any OpenAI-compatible endpoint and streams them into pgokf.set_concept_embedding."
homepage.workspace = true
documentation.workspace = true
# Overrides the workspace default: this member carries its own README covering
# the binary's CLI, so it is the one that should render on the registry page.
readme = "README.md"
keywords.workspace = true
# Overrides the workspace default: this member ships a binary, not a library.
categories = ["database", "command-line-utilities"]

[[bin]]
name = "pgokf-embed"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
pgokf-companion = { version = "=0.1.16", path = "../pgokf-companion" }
pgokf-pgconn = { version = "=0.1.16", path = "../pgokf-pgconn" }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7"

[lints]
workspace = true
