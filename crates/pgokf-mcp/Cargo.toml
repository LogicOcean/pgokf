[package]
name = "pgokf-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Model Context Protocol (MCP) server exposing the pgokf catalog to AI agents over stdio JSON-RPC."
homepage.workspace = true
documentation.workspace = true
# Overrides the workspace default: this member carries its own README covering
# the binary's CLI, so it is the one that should render on the registry page.
readme = "README.md"
keywords.workspace = true
# Overrides the workspace default: this member ships a binary, not a library.
categories = ["database", "command-line-utilities"]

[[bin]]
name = "pgokf-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
pgokf-pgconn = { version = "=0.1.13", path = "../pgokf-pgconn" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.40", features = [
    "macros",
    "rt-multi-thread",
    "io-std",
    "io-util",
] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }

[lints]
workspace = true
