[package]
name = "pgokf-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Model Context Protocol (MCP) server exposing the pgokf catalog to AI agents over stdio JSON-RPC, or over HTTP with bearer tokens and roles."
homepage.workspace = true
documentation.workspace = true
# Overrides the workspace default: this member carries its own README covering
# the binary's CLI, so it is the one that should render on the registry page.
readme = "README.md"
keywords.workspace = true
# Overrides the workspace default: this member ships a binary, not a library.
categories = ["database", "command-line-utilities"]

[[bin]]
name = "pgokf-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "tokio",
] }
clap = { version = "4.5", features = ["derive", "env"] }
pgokf-companion = { version = "=0.3.0-dev3", path = "../pgokf-companion", features = [
    "documents",
    "mcp-token",
] }
pgokf-pgconn = { version = "=0.3.0-dev3", path = "../pgokf-pgconn" }
pgokf-workspace = { version = "=0.3.0-dev3", path = "../pgokf-workspace" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.40", features = [
    "macros",
    "rt-multi-thread",
    "io-std",
    "io-util",
    "net",
    "signal",
    "sync",
    "time",
] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "timeout"] }

[lints]
workspace = true
