[package]
name = "pgokf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["pg18"]
pg15 = ["pgrx/pg15"]
pg16 = ["pgrx/pg16"]
pg17 = ["pgrx/pg17"]
pg18 = ["pgrx/pg18"]
pg19 = ["pgrx/pg19"]
pg_test = []

[dependencies]
arrow.workspace = true
okf-parser = { version = "=0.1.11", path = "../okf-parser" }
okf-sync = { version = "=0.1.11", path = "../okf-sync" }
parquet.workspace = true
pgrx.workspace = true

[dev-dependencies]
# In-database (`#[pg_test]`) harness. Pinned to the same version as `pgrx`
# (0.19.2, via the workspace) so the test runner and the extension ABI agree;
# `default-features = false` mirrors the workspace `pgrx` dependency, and the
# active `pgNN` feature is threaded through by `cargo pgrx test` at run time.
pgrx-tests = { version = "=0.19.2", default-features = false }

[lints]
workspace = true
