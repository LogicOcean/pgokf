[workspace]
members = [
    "crates/extension",
    "crates/okf-parser",
    "crates/okf-sync",
]
default-members = ["crates/okf-parser", "crates/okf-sync"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/LogicOcean/okf-pg-catalog"

[workspace.dependencies]
blake3 = "1.8"
glob = "0.3"
pgrx = { version = "0.19.2", default-features = false }
pulldown-cmark = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "=0.9.34"
stratify = { version = "1.1.0", features = ["logging"] }
thiserror = "2.0"
walkdir = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
