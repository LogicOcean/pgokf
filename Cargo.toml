[workspace]
members = [
    "crates/extension",
    "crates/okf-parser",
    "crates/okf-sync",
    "crates/pgokf-ingest",
]
default-members = ["crates/okf-parser", "crates/okf-sync"]
resolver = "2"

[workspace.package]
version = "0.1.11"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/LogicOcean/pgokf"

[workspace.dependencies]
# Arrow/Parquet are pure-Rust (no system libraries). default-features are
# disabled so only the columnar-array + schema core of `arrow` and the
# Arrow-backed Parquet writer with snappy/zstd compression of `parquet`
# compile in; the CSV/JSON/IPC/FFI surfaces are left out.
arrow = { version = "59", default-features = false }
parquet = { version = "59", default-features = false, features = [
    "arrow",
    "snap",
    "zstd",
] }
blake3 = "1.8"
globset = "0.4"
pgrx = { version = "0.19.2", default-features = false }
pulldown-cmark = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "=0.9.34"
stratify = { version = "1.1.0", features = ["logging"] }
thiserror = "2.0"
tracing = "0.1"
walkdir = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
