[workspace]
members = [
    "crates/extension",
    "crates/okf-parser",
    "crates/okf-sync",
    "crates/pgokf-companion",
    "crates/pgokf-embed",
    "crates/pgokf-ingest",
    "crates/pgokf-mcp",
    "crates/pgokf-pgconn",
]
default-members = ["crates/okf-parser", "crates/okf-sync"]
resolver = "2"

[workspace.package]
version = "0.1.16"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"
repository = "https://github.com/LogicOcean/pgokf"
homepage = "https://logicocean.github.io/pgokf/"
documentation = "https://logicocean.github.io/pgokf/"
# Resolved relative to this workspace root, so every member inherits the one
# top-level README rather than carrying a copy.
readme = "README.md"
# crates.io caps this at 5 keywords of at most 20 characters each.
keywords = ["postgresql", "okf", "knowledge-base", "catalog", "search"]
categories = ["database", "text-processing"]

[workspace.dependencies]
# Arrow/Parquet are pure-Rust (no system libraries). default-features are
# disabled so only the columnar-array + schema core of `arrow` and the
# Arrow-backed Parquet writer with snappy/zstd compression of `parquet`
# compile in; the CSV/JSON/IPC/FFI surfaces are left out.
arrow = { version = "59", default-features = false }
parquet = { version = "59", default-features = false, features = [
    "arrow",
    "snap",
    "zstd",
] }
blake3 = "1.8"
globset = "0.4"
pgrx = { version = "0.19.2", default-features = false }
pulldown-cmark = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "=0.9.34"
stratify = { version = "1.1.0", features = ["logging"] }
thiserror = "2.0"
tracing = "0.1"
walkdir = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
